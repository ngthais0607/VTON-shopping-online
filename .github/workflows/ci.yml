name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: password123
          MARIADB_DATABASE: fastapi_founder_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h localhost -uroot -ppassword123" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: mysql+pymysql://root:password123@127.0.0.1:3306/fastapi_founder_test
      TEST_DATABASE_URL: mysql+pymysql://root:password123@127.0.0.1:3306/fastapi_founder_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-test-secret-key-32-characters-minimum
      VIETQR_BANK_ID: MB
      VIETQR_ACCOUNT_NO: "0000000000"
      VIETQR_ACCOUNT_NAME: TRUELOOK
      VIETQR_WEBHOOK_SECRET: ci-test-webhook-secret-32-chars-min
      MINIO_ACCESS_KEY: ci-test-minio-access-key
      MINIO_SECRET_KEY: ci-test-minio-secret-key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev-lock.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev-lock.txt
          pip check

      - name: Wait for Services
        working-directory: backend
        run: |
          python -c "
          import time, pymysql, redis
          for i in range(30):
              try:
                  conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='password123', database='fastapi_founder_test')
                  conn.close()
                  r = redis.Redis(host='127.0.0.1', port=6379, socket_timeout=2)
                  r.ping()
                  print('MariaDB and Redis are ready!')
                  break
              except Exception as e:
                  print(f'Waiting for services... ({e})')
                  time.sleep(2)
          else:
              raise SystemExit('Services timed out')
          "

      - name: Lint with Ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check app tests

      - name: Run Alembic Migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head 2>&1 | tee /tmp/alembic.log || {
            echo "### Alembic Migration Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/alembic.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Verify Migration Downgrade & Upgrade Roundtrip
        working-directory: backend
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run Tests (Unit & Concurrency Integration)
        working-directory: backend
        run: |
          pytest -v 2>&1 | tee /tmp/pytest.log || {
            echo "### Pytest Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        working-directory: frontend
        run: |
          pnpm exec tsc --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: |
          pnpm test

      - name: ESLint
        working-directory: frontend
        run: pnpm exec eslint . --max-warnings=0

      - name: Next.js Production Build
        working-directory: frontend
        run: |
          pnpm run build

  compose-smoke:
    name: Isolated Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: python .github/scripts/compose_smoke.py
        env:
          SMOKE_BROWSER_TESTS: "1"
