name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: password123
          MARIADB_DATABASE: fastapi_founder_test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h localhost -uroot -ppassword123" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: mysql+pymysql://root:password123@127.0.0.1:3306/fastapi_founder_test
      TEST_DATABASE_URL: mysql+pymysql://root:password123@127.0.0.1:3306/fastapi_founder_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-test-secret-key-32-characters-minimum

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for Services
        working-directory: backend
        run: |
          python -c "
          import time, pymysql, redis
          for i in range(30):
              try:
                  conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='password123', database='fastapi_founder_test')
                  conn.close()
                  r = redis.Redis(host='127.0.0.1', port=6379, socket_timeout=2)
                  r.ping()
                  print('MariaDB and Redis are ready!')
                  break
              except Exception as e:
                  print(f'Waiting for services... ({e})')
                  time.sleep(2)
          else:
              raise SystemExit('Services timed out')
          "

      - name: Lint with Ruff
        working-directory: backend
        run: |
          ruff check app/ tests/

      - name: Run Alembic Migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run Tests (Unit & Concurrency Integration)
        working-directory: backend
        run: |
          pytest -v

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        working-directory: frontend
        run: |
          pnpm exec tsc --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: |
          pnpm test

      - name: Next.js Production Build
        working-directory: frontend
        run: |
          pnpm run build
