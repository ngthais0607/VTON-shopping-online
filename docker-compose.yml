x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}@mariadb:3306/${MARIADB_DATABASE:-fastapi_founder}}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}}
  MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL:-http://localhost:9000}
  VIETQR_BANK_ID: ${VIETQR_BANK_ID:?VIETQR_BANK_ID is required}
  VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:?VIETQR_ACCOUNT_NO is required}
  VIETQR_BANK_NAME: ${VIETQR_BANK_NAME:-MB Bank}
  VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-TRUELOOK}
  VIETQR_WEBHOOK_SECRET: ${VIETQR_WEBHOOK_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
  EMAILS_ENABLED: ${EMAILS_ENABLED:-true}
  EMAILS_CONSOLE_LOG: ${EMAILS_CONSOLE_LOG:-true}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-noreply@truelook.com}
  EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-TrueLook E-Commerce}

services:
  mariadb:
    image: mariadb:11.2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-fastapi_founder}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    command: python -m alembic upgrade head
    environment: *backend-env
    depends_on:
      mariadb:
        condition: service_healthy

  api:
    build: ./backend
    restart: always
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment: *backend-env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  arq_worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    restart: always
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-http://localhost:9000}
        MINIO_INTERNAL_URL: http://minio:9000
        MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
  redis_data:
  minio_data:
